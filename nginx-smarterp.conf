# =========================================================================
# SmartERP Enterprise — Nginx Reverse Proxy Production Configuration
# Copy this file to /etc/nginx/sites-available/smarterp and symlink to sites-enabled
# =========================================================================

server {
    listen 80;
    server_name your-domain.com www.your-domain.com your-server-ip;

    # Maximum file upload size (for attachments, product images, backups)
    client_max_body_size 25M;

    # Gzip Compression for blazing fast load times
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json image/svg+xml;

    # Reverse proxy to SmartERP Node.js backend (Port 5000)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # WebSocket & Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }

    # Optional: Cache static assets
    location /assets/ {
        proxy_pass http://127.0.0.1:5000/assets/;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
